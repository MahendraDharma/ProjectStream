<a class="card" href="/detail/{{ c.media_type }}/{{ c.tmdb_id }}">
  {% if c.poster %}
    <img class="poster" src="{{ c.poster | tmdb_img }}" alt="{{ c.title }}" loading="lazy">
  {% else %}
    <div class="poster empty"><span>?</span></div>
  {% endif %}
  {% if c.rating %}
  <span class="rating-chip"><span class="star">★</span> {{ '%.1f' | format(c.rating) }}</span>
  {% endif %}
  <p class="title">{{ c.title }}</p>
  <p class="sub">{{ c.year }}</p>
</a>
