[project]
name = "projectstream"
version = "0.1.0"
description = "Personal movie & TV streaming app: TMDB catalog, local media playback, YouTube trailers, public-domain films."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mahendra Dharma" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes"]
package-dir = { "" = "server" }

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.ruff]
line-length = 130
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: `Depends()` in argument defaults is the FastAPI injection idiom.
# B005: multi-char .strip("chars") is intentional in the filename parser.
ignore = ["B008", "B005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
